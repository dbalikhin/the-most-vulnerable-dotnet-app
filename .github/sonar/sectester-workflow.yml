name: SecTester Sonar automatic vs compiled
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sonar-sectester-comparison
  cancel-in-progress: false
env:
  SONAR_PROJECT_KEY: dbalikhin_sectester-net-demo
  TARGET_SOURCE_SHA: 7832f89b551e871f3c1a2db5ce31566c93fd2890
  HUSKY: '0'
jobs:
  compare:
    runs-on: windows-2025
    timeout-minutes: 50
    defaults:
      run:
        shell: pwsh
        working-directory: target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: dbalikhin/sectester-net-demo
          ref: 7832f89b551e871f3c1a2db5ce31566c93fd2890
          path: target
          fetch-depth: 0
          persist-credentials: false
      - name: Import target and observe automatic analysis with all security rules
        timeout-minutes: 25
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: python ../harness/.github/sonar/sectester-driver.py automatic
      - name: Preserve automatic findings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sectester-sonar-automatic
          path: target/sonar-artifacts/automatic/
          retention-days: 14
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: |
            6.0.x
            8.0.x
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - name: Switch to compiled analysis with identical source and profile
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: python ../harness/.github/sonar/sectester-driver.py preflight
      - name: Install scanner outside target SDK pin
        working-directory: harness
        run: dotnet tool install dotnet-sonarscanner --version 12.0.0 --tool-path "$env:RUNNER_TEMP/sectester-sonar"
      - name: Restore application
        run: dotnet restore src/App/App.csproj
      - name: Begin compiled security analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          & "$env:RUNNER_TEMP/sectester-sonar/dotnet-sonarscanner" begin /k:"$env:SONAR_PROJECT_KEY" /o:dbalikhin /v:"compiled-$env:GITHUB_RUN_ID" /d:sonar.host.url=https://sonarcloud.io /d:sonar.token="$env:SONAR_TOKEN" /d:sonar.projectBaseDir="$pwd" /d:sonar.scm.revision="$env:COMPARISON_COMMIT" /d:sonar.branch.name=master /d:sonar.scanner.scanAll=false /d:sonar.sca.enabled=false /d:sonar.dotnet.excludeTestProjects=true /d:sonar.inclusions="src/App/**/*.cs" /d:sonar.exclusions="**/bin/**,**/obj/**"
          exit $LASTEXITCODE
      - name: Compile application with security analyzers
        run: |
          $timer = [Diagnostics.Stopwatch]::StartNew()
          dotnet build src/App/App.csproj --no-restore --no-incremental --configuration Release -p:UseSharedCompilation=false 2>&1 | Tee-Object sonar-artifacts/compiled/build.log
          $scanExit = $LASTEXITCODE
          @{ build_with_analysis_seconds = $timer.Elapsed.TotalSeconds; build_exit_code = $scanExit } | ConvertTo-Json | Set-Content sonar-artifacts/compiled/timing-build.json
          exit $scanExit
      - name: Submit analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          $timer = [Diagnostics.Stopwatch]::StartNew()
          & "$env:RUNNER_TEMP/sectester-sonar/dotnet-sonarscanner" end /d:sonar.token="$env:SONAR_TOKEN"
          $scanExit = $LASTEXITCODE
          @{ end_and_upload_seconds = $timer.Elapsed.TotalSeconds } | ConvertTo-Json | Set-Content sonar-artifacts/compiled/timing-end.json
          exit $scanExit
      - name: Export findings and timings
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: python ../harness/.github/sonar/sectester-driver.py collect
      - name: Preserve compiled findings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sectester-sonar-compiled
          path: target/sonar-artifacts/compiled/
          retention-days: 14
