name: SecTester Sonar automatic eligibility diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  SONAR_PROJECT_KEY: dbalikhin_sectester-net-demo
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Read eligibility and binding with existing token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: python .github/sonar/sectester-driver.py repair
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ always() }}
        with:
          name: sectester-sonar-diagnostics
          path: sonar-artifacts/compiled/
          retention-days: 14
